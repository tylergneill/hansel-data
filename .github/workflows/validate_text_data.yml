name: Validate text data

on:
  # Every branch push, so a branch's checks show before any pull request.
  push:
  pull_request:
    branches:
      - main

jobs:
  run-text-validation:
    runs-on: ubuntu-latest

    steps:
    - run: echo "checking out repo"
    - name: Checkout repository
      uses: actions/checkout@v7

    - run: echo "setting up Python"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

#     - run: echo "installing Python dependencies"
#     - name: Install dependencies
#       run: |
#         python -m pip install --upgrade pip
#         pip install -r requirements.txt

    - run: echo "setting execute permission for validation script"
    - name: Set execute permission for validation script
      run: chmod +x .github/scripts/validate_text_data.sh

    - run: echo "running validation script"
    - name: Run script
      run: .github/scripts/validate_text_data.sh

  # TEI-XML project editions: the HANSEL schema (RELAX NG + Schematron) and the
  # stock TEI tei_all cross-check. Uses the pip-only engines from requirements.txt
  # (pyjing needs Java, which setup-java provides; saxonche needs none).
  # See utils/validation/xml/README.md.
  validate-xml:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up Java (for Jing)
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate XML against the HANSEL schema
      run: make validate JING=pyjing SAXON="python saxon_cli.py"

    - name: Cross-check XML against TEI tei_all
      run: make validate-tei-all JING=pyjing
